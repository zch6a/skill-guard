name: Release
# On a version tag: test and pack with a read-only token, then make the GitHub release (the version's CHANGELOG
# section, with the installable package attached). The job with write access runs nothing of the project: it only
# calls gh. Actions are pinned to commits.
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - name: The tag is the package version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Pack, and check that the packed CLI runs
        run: |
          npm pack --ignore-scripts
          mkdir -p "$RUNNER_TEMP/try" && cd "$RUNNER_TEMP/try"
          npm init -y > /dev/null
          npm install --ignore-scripts "$GITHUB_WORKSPACE"/skill-guard-*.tgz
          npx --no-install skill-guard --version
          npx --no-install skill-guard scan "$GITHUB_WORKSPACE/plugin" --no-color
      - name: Release notes from the CHANGELOG
        run: node scripts/release-notes.mjs "${GITHUB_REF_NAME#v}" > notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            notes.md
            skill-guard-*.tgz
          if-no-files-found: error
  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" skill-guard-*.tgz --title "skill-guard $version" --notes-file notes.md --verify-tag --repo "$GITHUB_REPOSITORY"
          fi
          echo "released $GITHUB_REF_NAME"
