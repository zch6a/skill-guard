name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only: tests need no write access.
permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22', '24']
    steps:
      # Actions pinned to commits; the token is not left in the checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      # No install scripts from dependencies; the build is run explicitly below.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: The scanner scans itself
        run: node dist/bin.js scan . --fail-on high --no-color

  corpus:
    name: Precision on public skill repositories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/skill-guard-corpus
          key: corpus-${{ hashFiles('scripts/corpus.json') }}
      # Pinned commits, shallow fetch, read-only: nothing from these repositories is executed.
      # No `npm ci` needed: Node 24 runs the TypeScript sources directly and there are no runtime deps.
      - run: npm run corpus
        env:
          SKILL_GUARD_CORPUS: ${{ runner.temp }}/skill-guard-corpus
