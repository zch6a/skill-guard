<svg xmlns="http://www.w3.org/2000/svg" width="920" height="423" viewBox="0 0 920 423" role="img" aria-label="skill-guard scanning a downloaded skill: it decodes a hidden instruction in invisible characters, a download-and-run installer, an instruction to hide actions from the user, and a script that reads credentials">
<style>
  .bg { fill: #14161a; } .bar { fill: #1d2026; }
